[package]
name = "downbound"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["2d", "audio"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]
dev = ["bevy/dynamic_linking"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Gitche Gumee</title>
<link rel="icon" href="../img/freighter.png">
<style>
  :root { --night: #0a1638; --foam: #c0e0f0; --gray: #a0a0a0; --amber: #e08000; --yellow: #f0d040; --mono: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; color: var(--foam); font: 1rem/1.6 var(--mono); }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.25rem; padding: 1rem; background: var(--night); text-align: center; }
  #intro[hidden] { display: none; }
  h1 { margin: 0; color: #f0f0e8; font-size: clamp(1.75rem, 7vw, 3.5rem); line-height: 1.1; text-transform: uppercase; }
  img { width: min(100%, 384px); height: auto; image-rendering: pixelated; }
  p { margin: 0; max-width: 34rem; }
  button { padding: .7rem 1.4rem; border: 2px solid var(--amber); background: var(--amber); color: #050b1e; font: inherit; text-transform: uppercase; cursor: pointer; }
  button:hover:enabled { background: var(--yellow); border-color: var(--yellow); }
  button:disabled { background: none; color: var(--amber); cursor: progress; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
  a { color: var(--gray); }
  #error { color: #ff8a70; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" tabindex="0" aria-label="Gitche Gumee game screen"></canvas></div>
<div id="intro">
  <h1>Gitche Gumee</h1>
  <img src="../img/freighter.png" width="384" height="120" alt="">
  <p>Needs a keyboard and a browser with WebGL2. The game has sound.</p>
  <button id="start" type="button">Start the voyage</button>
  <p id="error" role="alert" hidden></p>
  <a href="../">Back to the site</a>
</div>
<script type="module">
  const intro = document.getElementById("intro");
  const start = document.getElementById("start");
  const error = document.getElementById("error");

  // Starting from a click lets the browser play the game's sound.
  async function begin() {
    start.disabled = true;
    start.textContent = "Loading...";
    error.hidden = true;
    try {
      const game = await import("./game.js");
      intro.hidden = true;
      document.getElementById("game").focus();
      await game.default();
    } catch (reason) {
      // winit leaves its event loop by throwing this on purpose.
      if (String(reason).includes("Using exceptions for control flow")) return;
      console.error(reason);
      intro.hidden = false;
      start.hidden = true;
      error.textContent = "The game could not start in this browser. Reload the page to try again.";
      error.hidden = false;
    }
  }

  start.addEventListener("click", begin);
  if (location.hash === "#start") begin();
</script>
</body>
</html>
